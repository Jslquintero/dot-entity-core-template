services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: template
      POSTGRES_USER: template
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python3 scripts/setup-dev.py first}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U template -d template"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Template.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=template;Username=template;Password=${POSTGRES_PASSWORD:?Run setup first}
      Jwt__Key: ${JWT_KEY:?Run setup first}
      Seed__Enabled: "true"
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@example.test}
      Seed__AdminPassword: ${ADMIN_PASSWORD:?Run setup first}
    ports:
      - "127.0.0.1:${API_PORT:-5249}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
